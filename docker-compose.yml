services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paygam
      POSTGRES_USER: paygam
      POSTGRES_PASSWORD: paygam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygam -d paygam"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DOCS_ENABLED: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      SECRET_KEY: local-dev-secret-key-change-me-32chars-min
      INTERNAL_SERVICE_KEY: local-internal-key
      TEMPLATE_ENCRYPTION_KEY: ${TEMPLATE_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql+psycopg://paygam:paygam@db:5432/paygam
      EGOV_USE_MOCK: "true"
      TELCO_USE_MOCK: "true"
      CITIZEN_RISK_ALLOW_SYNTHETIC_TRAIN_ON_BOOT: "true"
      CITIZEN_RISK_MODEL_DIR: model_artifacts/citizen_risk
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./model_artifacts:/app/model_artifacts

volumes:
  postgres_data:
